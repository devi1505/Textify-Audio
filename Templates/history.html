<!DOCTYPE html>
<html>
<head>
<title>Transcription History</title>
<style>
body {
    background: #0f172a;
    color: white;
    font-family: Arial;
    padding: 30px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 15px;
}

h2 { color: #38bdf8; }
</style>
</head>

<body>

<h1>📜 Transcription History</h1>

{% for file, text, date in records %}
<div class="card">
    <h2>{{ file }}</h2>
    <small>{{ date }}</small>
    <p>{{ text }}</p>
</div>
{% endfor %}

</body>
</html>
